<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Diva 🎂</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  overflow: hidden;
  background: linear-gradient(135deg, #16001f, #3b0754, #12001a);
  color: white;
}

/* ---------- PAGE 1 ---------- */

.page {
  width: 100%;
  height: 100vh;
  display: none;
  position: relative;
  overflow: hidden;
}

.page.active {
  display: flex;
}

#page1 {
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.title {
  font-size: clamp(28px, 8vw, 55px);
  margin-bottom: 35px;
  text-align: center;
  text-shadow: 0 0 20px #ff7be5;
}

/* Gift */

.gift {
  position: relative;
  width: 190px;
  height: 160px;
  margin-bottom: 35px;
  animation: float 2s ease-in-out infinite;
}

.box {
  position: absolute;
  bottom: 0;
  width: 190px;
  height: 115px;
  border-radius: 8px;
  background: linear-gradient(135deg, #ff315d, #c90045);
  box-shadow: 0 15px 40px rgba(255, 0, 100, .4);
}

.box:before {
  content: "";
  position: absolute;
  left: 78px;
  width: 34px;
  height: 115px;
  background: #ffd447;
}

.lid {
  position: absolute;
  top: 22px;
  left: -10px;
  width: 210px;
  height: 38px;
  border-radius: 8px;
  background: linear-gradient(135deg, #ff426d, #e00048);
  z-index: 3;
  transition: 1s;
}

.lid:after {
  content: "";
  position: absolute;
  left: 88px;
  width: 34px;
  height: 38px;
  background: #ffd447;
}

.bow {
  position: absolute;
  top: -8px;
  left: 75px;
  z-index: 5;
}

.bow span {
  display: inline-block;
  width: 45px;
  height: 35px;
  background: #ffd447;
  border-radius: 50%;
  transform: rotate(30deg);
}

.bow span:last-child {
  transform: rotate(-30deg);
}

.open .lid {
  transform: translateY(-100px) rotate(-8deg);
}

button {
  border: none;
  padding: 15px 30px;
  border-radius: 30px;
  font-size: 18px;
  font-weight: bold;
  color: white;
  background: linear-gradient(90deg, #ff2f7d, #a91fff);
  box-shadow: 0 0 25px rgba(255, 50, 160, .7);
  cursor: pointer;
  transition: .3s;
}

button:active {
  transform: scale(.94);
}

@keyframes float {
  50% {
    transform: translateY(-12px);
  }
}

/* ---------- PAGE 2 ---------- */

#page2 {
  flex-direction: column;
  align-items: center;
}

.heading {
  position: relative;
  z-index: 20;
  width: 100%;
  padding: 25px 10px 18px;
  text-align: center;
  background: rgba(20, 0, 30, .65);
  backdrop-filter: blur(8px);
}

.heading h1 {
  margin: 0;
  font-size: clamp(30px, 9vw, 62px);
  background: linear-gradient(90deg, #ffd1f5, #ff55c8, #fff);
  -webkit-background-clip: text;
  color: transparent;
  animation: glow 1.8s infinite alternate;
}

.heading p {
  margin: 8px 0 0;
  font-size: 17px;
}

@keyframes glow {
  from {
    filter: drop-shadow(0 0 4px #ff4bc4);
  }
  to {
    filter: drop-shadow(0 0 22px #ff4bc4);
  }
}

/* Wishes */

.wishes {
  position: absolute;
  inset: 105px 0 0;
  overflow: hidden;
}

.wish {
  position: absolute;
  bottom: -80px;
  left: var(--left);
  width: max-content;
  max-width: 90%;
  text-align: center;
  font-size: clamp(17px, 4.5vw, 26px);
  font-weight: bold;
  color: white;
  text-shadow: 0 0 10px #ff52c8, 0 0 20px #ff52c8;
  animation: rise var(--time) linear infinite;
  animation-delay: var(--delay);
}

@keyframes rise {
  from {
    transform: translateY(0);
    opacity: 0;
  }

  10% {
    opacity: 1;
  }

  90% {
    opacity: 1;
  }

  to {
    transform: translateY(-105vh);
    opacity: 0;
  }
}

/* Floating hearts */

.heart {
  position: absolute;
  bottom: -30px;
  font-size: 25px;
  animation: heartRise 6s linear infinite;
  opacity: .8;
}

@keyframes heartRise {
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<!-- PAGE 1 -->

<section id="page1" class="page active">

  <div class="title">🎁 A Special Surprise 🎁</div>

  <div class="gift" id="gift">
    <div class="bow">
      <span></span><span></span>
    </div>

    <div class="lid"></div>

    <div class="box"></div>
  </div>

  <button onclick="openGift()">✨ Open Surprise ✨</button>

</section>


<!-- PAGE 2 -->

<section id="page2" class="page">

  <div class="heading">
    <h1>✨ Happy Birthday, Diva! ✨</h1>
    <p>💖 Wishing you a beautiful and wonderful day 💖</p>
  </div>

  <div class="wishes" id="wishes"></div>

</section>


<script>

const wishes = [
  "🎂 Happy Birthday, Diva!",
  "💖 May you live a long and beautiful life!",
  "🌸 Stay blessed and keep smiling always!",
  "✨ May all your dreams come true!",
  "🥳 Wishing you endless happiness!",
  "💕 Keep shining like a star!",
  "🌟 Have the most amazing birthday ever!",
  "🎁 May your life be filled with love and joy!",
  "💫 May every moment of your life be special!",
  "🌷 Wishing you health, happiness and success!",
  "❤️ May your heart always be full of happiness!",
  "🎉 Enjoy your special day to the fullest!",
  "🌈 May your future be bright and beautiful!",
  "💝 Keep smiling and spreading happiness!",
  "🦋 May every new day bring you new reasons to smile!",
  "👑 Keep shining, Diva!",
  "🎀 You deserve all the happiness in the world!",
  "🌹 May your life always be surrounded by love!",
  "⭐ Never stop dreaming and believing!",
  "💐 Wishing you a lifetime of beautiful memories!",
  "🥰 Stay happy, stay blessed, stay amazing!",
  "🎊 May this birthday bring you countless beautiful moments!",
  "💜 May your wishes become reality!",
  "🌟 You are truly special—keep shining!",
  "🎂 Once again, Happy Birthday Diva!",
  "💖 Lots of love, happiness and blessings for you!",
  "✨ May every year make your life more wonderful!",
  "🌸 Keep smiling because your smile is precious!",
  "🎁 Have a magical birthday, Diva!",
  "❤️ May happiness follow you everywhere!"
];

function openGift() {

  const gift = document.getElementById("gift");
  gift.classList.add("open");

  setTimeout(() => {
    document.getElementById("page1").classList.remove("active");
    document.getElementById("page2").classList.add("active");
    createWishes();
    createHearts();
  }, 1100);
}

function createWishes() {

  const container = document.getElementById("wishes");

  wishes.forEach((text, index) => {

    const wish = document.createElement("div");

    wish.className = "wish";
    wish.innerHTML = text;

    wish.style.setProperty(
      "--left",
      (5 + Math.random() * 80) + "%"
    );

    wish.style.setProperty(
      "--time",
      (7 + Math.random() * 6) + "s"
    );

    wish.style.setProperty(
      "--delay",
      (Math.random() * 8) + "s"
    );

    container.appendChild(wish);
  });
}

function createHearts() {

  for (let i = 0; i < 25; i++) {

    const heart = document.createElement("div");

    heart.className = "heart";

    heart.innerHTML =
      ["❤️","💖","💕","💗","💓","💜","✨"][Math.floor(Math.random() * 7)];

    heart.style.left =
      Math.random() * 100 + "%";

    heart.style.animationDelay =
      Math.random() * 6 + "s";

    heart.style.animationDuration =
      (5 + Math.random() * 5) + "s";

    document.getElementById("page2").appendChild(heart);
  }
}

</script>

</body>
</html>
